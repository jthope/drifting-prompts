[package]
name = "ipcamera-media"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "IP Camera RTSP playback: the glass2glass pipeline and the newest decoded frame"

[lints]
workspace = true

# No UI or renderer: frames leave as plain BGRA bytes.
[dependencies]
ipcamera-core.workspace = true
g2g-core.workspace = true
g2g-plugins.workspace = true
retina.workspace = true
# A Reolink's FLV streams over HTTP or HTTPS.
reqwest.workspace = true
rust_h264.workspace = true
rust_h265.workspace = true
# `sync`: the broadcast channel that hands a relay's pictures to viewers.
tokio = { workspace = true, features = ["sync"] }
url.workspace = true

[features]
# A test pattern served over RTSP, encoded by Media Foundation; off so the app ships no encoder.
pretend-camera = ["g2g-plugins/mf-encode", "g2g-plugins/rtsp-server"]

[[example]]
name = "pretend_camera"
required-features = ["pretend-camera"]

# Sound through WASAPI.
[target.'cfg(windows)'.dependencies]
g2g-plugins = { workspace = true, features = ["wasapi-sink"] }

[dev-dependencies]
tempfile.workspace = true

# The pretend camera for tests: Media Foundation's encoder and glass2glass's RTSP server.
[target.'cfg(windows)'.dev-dependencies]
g2g-plugins = { workspace = true, features = ["mf-encode", "rtsp-server"] }

# Sound through ALSA, loaded at run time, so no development package is needed.
[target.'cfg(target_os = "linux")'.dependencies]
g2g-plugins = { workspace = true, features = ["alsa-sink"] }
