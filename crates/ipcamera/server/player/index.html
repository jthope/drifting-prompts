<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IP Camera</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font: 14px/1.45 system-ui, sans-serif;
        background: Canvas;
        color: CanvasText;
      }

      /* The camera list. */
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 24px 16px;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 16px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li a {
        display: block;
        padding: 10px 12px;
        border-radius: 6px;
        color: inherit;
        text-decoration: none;
      }
      li a:hover,
      li a:focus-visible {
        background: color-mix(in srgb, CanvasText 8%, transparent);
      }
      .note {
        opacity: 0.7;
      }

      /* The password box, for a server that has one. */
      form {
        display: grid;
        gap: 12px;
        max-width: 20rem;
      }
      label {
        display: grid;
        gap: 4px;
      }
      input,
      button {
        font: inherit;
        padding: 6px 10px;
      }

      /* One camera, filling the page, as a tile shows it. */
      body.playing {
        background: #000;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* Over the last picture, dimmed so it can't pass for live, as the desktop's tiles dim it. */
      #status {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        text-align: center;
        color: rgb(255 255 255 / 0.85);
        background: rgb(0 0 0 / 0.65);
        pointer-events: none;
      }
      #status[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <script src="/player.js" defer></script>
  </body>
</html>
