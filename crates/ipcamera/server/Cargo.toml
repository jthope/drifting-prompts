[package]
name = "ipcamera-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "IP Camera server: relays the cameras' live video to browsers, with no desktop app"

[lints]
workspace = true

# The cameras come from `core`'s library, as the app's do, `media` relays their video, and
# `storage` keeps the snapshots and recordings by the desktop's rules. No UI, no renderer and no
# sound device: the server decodes only the picture a snapshot or a thumbnail asks for.
[dependencies]
ipcamera-core.workspace = true
ipcamera-media.workspace = true
ipcamera-storage.workspace = true
anyhow.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
argon2.workspace = true
# A session's key and a password's salt, from the system's random generator.
uuid = { workspace = true, features = ["v4"] }
# A multi-threaded runtime for the viewers, which each camera's relay session (a thread of its own)
# hands its pictures to; `signal` ends the server on Ctrl+C.
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "signal"] }

[dev-dependencies]
tempfile.workspace = true
tungstenite.workspace = true

# The pretend camera, which the tests watch through the server. It encodes with Media Foundation.
[target.'cfg(windows)'.dev-dependencies]
ipcamera-media = { workspace = true, features = ["pretend-camera"] }
