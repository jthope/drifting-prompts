[package]
name = "nsh-app-ipcamera"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

# The root workspace's lints, repeated: a workspace of its own cannot inherit them. `unsafe` is
# allowed for the Win32 calls, each with a `// SAFETY:` comment.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = "warn"
mod_module_files = "warn"
undocumented_unsafe_blocks = "warn"

# No profiles here: nsh builds through a workspace of its own, so `.cargo/config.toml` optimizes
# the decoders.

[dependencies]
nsh-core = "0.6.1"
nsh-base = "0.6.1"
# The server's answers on the web, read into `ipcamera_core::api`'s types.
serde = "1"
serde_json = "1"
# The cameras, groups and views, with the desktop's rules on the web too.
ipcamera-core = { path = "../core" }
# The suite's themes, window place and folder calls.
dp-ui = { path = "../../dp/ui" }

# Desktop only: the live picture is Direct2D, and a browser cannot open RTSP.
[target.'cfg(windows)'.dependencies]
nsh-platform-windows = { version = "0.6.1", default-features = false }
ipcamera-media = { path = "../media" }
# Snapshots and recordings on disk; the web build asks the server instead.
ipcamera-storage = { path = "../storage" }
# The test pattern's stand-in pictures (`IPCAMERA_PICTURES`); version follows the root workspace's.
image = { version = "0.25", default-features = false, features = ["png"] }

# A temporary folder for each test.
[dev-dependencies]
tempfile = "3"
