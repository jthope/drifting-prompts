[package]
name = "nsh-app-ipcamera"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

# The root workspace's lints, said again here because this crate is a workspace of its own and so
# cannot inherit them. `unsafe_code` is not forbidden: the Win32, COM and Direct2D calls live here.
# Instead every `unsafe` block must say why it is sound, in a `// SAFETY:` comment.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = "warn"
mod_module_files = "warn"
undocumented_unsafe_blocks = "warn"

# The decoders are optimized even in debug builds, `nsh run` included, by the repository's
# `.cargo/config.toml`: nsh builds through a workspace of its own, which never reads this file's
# profiles.

[dependencies]
nsh-core = "0.5.1"
nsh-base = "0.5.1"
# The server's answers on the web, read into `ipcamera_core::api`'s types. Both are in the build
# already, through `ipcamera-core`.
serde = "1"
serde_json = "1"
# The cameras, groups and views, on every platform. The web preview keeps them in memory with the
# desktop's own rules and checks (`Library::in_memory`), so the two can't drift apart. Nothing in
# it streams or draws, and on the web it makes its ids without JavaScript glue (`ids.rs`).
ipcamera-core = { path = "../core" }
# What the suite's apps share to look alike: the theme files and the `Themes` module that draws
# them, where the window was left, and the folder picker and Explorer. Its styled TSX
# controls sit beside it, imported by path.
dp-ui = { path = "../../dp/ui" }

# The live picture is a Direct2D component, so its code and everything it needs build under
# `cfg(windows)`. That also keeps the camera stack out of the web build: a browser cannot open an
# RTSP connection, and the media crate plays sound through WASAPI.
[target.'cfg(windows)'.dependencies]
nsh-platform-windows = { version = "0.5.1", default-features = false }
ipcamera-media = { path = "../media" }
# Snapshots and recordings on disk, by the same rules the server keeps: their names, PNGs,
# thumbnails, and the free space on the drives they go to. The web build asks the server instead.
ipcamera-storage = { path = "../storage" }
# The pictures that stand in for cameras by name under the test pattern (`IPCAMERA_PICTURES`, for
# the READMEs' screenshots), read from PNGs. Already in the build through `ipcamera-storage`, at
# the root workspace's version.
image = { version = "0.25", default-features = false, features = ["png"] }

# Tests only: a folder of its own for each test, removed when it ends. The root workspace uses the
# same crate for the same reason.
[dev-dependencies]
tempfile = "3"
