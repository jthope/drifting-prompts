[package]
name = "ipcamera-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "IP Camera settings, cameras and camera groups, RTSP addressing and Dahua PTZ/DVRIP"

[lints]
workspace = true

# No UI and no media stack: `cargo test -p ipcamera-core` needs no GPU, window or decoder.
[dependencies]
# Safe saving of the settings files, and the lock helper.
dp-store.workspace = true
md-5.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

# Random ids off the web build: randomness there needs JavaScript glue it lacks (`ids.rs`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uuid = { workspace = true, features = ["v4"] }
# Reolink's and Dahua's HTTP APIs and Dahua's XML; the web build has no camera protocols.
ureq.workspace = true
roxmltree.workspace = true
percent-encoding.workspace = true
# ONVIF, and the runtime its async client blocks on.
oxvif.workspace = true
tokio.workspace = true

# DPAPI encrypts each saved password for the account running the app (`saved_password.rs`).
[target.'cfg(windows)'.dependencies]
ipcamera-dpapi.workspace = true
base64.workspace = true

[dev-dependencies]
# The fake Dahua in `tests/dahua_http.rs` checks each login's digest.
md-5.workspace = true
serde_json.workspace = true
# The real-camera check in `tests/dahua_http.rs` asks its ports what they are, without a login.
ureq.workspace = true
tempfile.workspace = true
