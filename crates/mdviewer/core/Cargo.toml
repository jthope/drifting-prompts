[package]
name = "mdviewer-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Markdown Viewer's projects and settings, the Markdown files in a project, and a file's outline"

[lints]
workspace = true

# Plain data and files: no UI and no nsh, so `cargo test -p mdviewer-core` runs anywhere, in
# milliseconds.
[dependencies]
# `settings.json` and `projects.json` are saved through the suite's store.
dp-store.workspace = true
pulldown-cmark.workspace = true
regex.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
