[package]
name = "nsh-app-mdviewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"

[workspace]

# The root workspace's lints, repeated: a workspace of its own cannot inherit them.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
mod_module_files = "warn"

[dependencies]
nsh-core = "0.6.1"
nsh-base = "0.6.1"
# The suite's themes, window place and folder calls.
dp-ui = { path = "../../dp/ui" }
# Projects, settings, files, outline and search.
mdviewer-core = { path = "../core" }
# Decodes a dropped folder's `file:` URL.
percent-encoding = "2"

# A temporary folder per test.
[dev-dependencies]
tempfile = "3"
