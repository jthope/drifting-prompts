[package]
name = "dp-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"
description = "What the suite's apps share to look and behave alike: the theme files, where the window was left, picking and showing folders, with the styled TSX controls beside this crate."

# A workspace of its own: it is built with nsh, which the root workspace never builds.
[workspace]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
mod_module_files = "warn"

[dependencies]
# The `Themes` module each app registers (`#[module]`), and the tokens it sets.
nsh-core = "0.6.1"
# Reads the theme files into tokens, as nsh reads an app's `theme.json`.
nsh-base = "0.6.1"
# What every product saves of its window.
dp-store = { path = "../store" }

# Tests only: reads the theme files as JSON, to check each sets every token.
[dev-dependencies]
serde_json = "1"
