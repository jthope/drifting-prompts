name: CI

on:
  workflow_dispatch:

run-name: CI on ${{ github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Installs nothing on purpose: a UI or media dependency in these crates fails here.
  core:
    name: Core, no system libraries at all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked -p dp-store -p ipcamera-core -p mdviewer-core --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked -p dp-store -p ipcamera-core -p mdviewer-core

  # glass2glass's build script calls `pkg-config`; ALSA is loaded at run time.
  linux:
    name: Linux build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace

  msrv:
    name: Rust 1.95
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config

      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep in step with `rust-version` in the root Cargo.toml.
          toolchain: "1.95"

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - run: cargo check --locked --workspace --all-targets

  # Lint only, and never on pull requests: Windows minutes cost about twice Linux ones.
  windows:
    name: Windows, lint only
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        # No `--all-targets`: the Linux job checks the test targets.
        run: cargo clippy --locked --workspace -- -D warnings

  # The workspaces of their own, which the jobs above don't build; cargo needs no `nsh` for them.
  app:
    name: ${{ matrix.crate }} on Windows
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        crate: [crates/ipcamera/app, crates/mdviewer/app, crates/dp/ui]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}

      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
