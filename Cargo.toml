[workspace]
members = ["crates/dp/store", "crates/ipcamera/core", "crates/ipcamera/dpapi", "crates/ipcamera/media", "crates/ipcamera/storage", "crates/ipcamera/server", "crates/mdviewer/core", "crates/xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
# The highest `rust-version` any dependency declares (glass2glass's `loom`).
rust-version = "1.95"

# Argon2 is slow by design: unoptimized, each password check takes seconds, tests included.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
# A restriction lint, which `all` leaves out.
mod_module_files = "warn"

[workspace.dependencies]
# The media pipeline: RTSP, BGRA, sound. `ipcamera-media` adds each platform's audio output.
g2g-core = "0.14"
g2g-plugins = { version = "0.14", features = ["std", "rtsp", "aac-decode"] }
# Our own DESCRIBE, to tell a rejected password apart; the version glass2glass uses.
retina = "0.4"
# H.264 decoding in Rust: Media Foundation's decoder costs about 160 MB a camera.
rust_h264 = "0.6"
# H.265 decoding in Rust: Media Foundation can't reach the HEVC decoder the Store installs.
rust_h265 = "0.4"
# retina takes the stream address as a parsed URL.
url = "2"
# retina is async: each camera session runs a current-thread runtime of its own.
tokio = { version = "1", features = ["rt", "time", "macros"] }

# Errors in the programs only (`ipcamera-server`'s `main.rs`, `xtask`).
anyhow = "1"

# The server's HTTP and the viewers' WebSocket.
axum = { version = "0.8", features = ["ws"] }
# Serving the web build's files (`fs`) and answering it across origins (`cors`).
tower-http = { version = "0.6", features = ["fs", "cors"] }
# `oneshot`, to answer a request with tower-http's file service; the version axum brings.
tower = { version = "0.5", features = ["util"] }
# Tests only: a blocking WebSocket client; the version axum brings.
tungstenite = "0.29"

# Reolink's and Dahua's HTTP APIs, blocking on each camera's thread. Not in the web build.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# ONVIF's SOAP services. Pinned exactly: its minor versions change its API.
oxvif = "=0.17.0"
# A Reolink's FLV streams over HTTP; the version and features `oxvif` brings.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Reading the replies of Dahua's XML API.
roxmltree = "0.21"
# Decoding `%20` escapes (ONVIF scopes, a dropped folder's `file:` URL); the version `url` brings.
percent-encoding = "2"

# DVRIP's JSON calls, and the MD5 hashes of DVRIP's and Dahua's HTTP logins.
serde_json = "1"
md-5 = "0.10"

# Everything saved as JSON.
serde = { version = "1", features = ["derive"] }

# Ids for cameras, groups and views; random ones (`v4`) only off the web, in `ipcamera-core`.
uuid = { version = "1", features = ["serde"] }

# The server's password, as a salted Argon2id hash.
argon2 = "0.5"

# DPAPI for the cameras' passwords (`ipcamera-dpapi`); the version `fs4` brings.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
# The encrypted passwords as text; the version reqwest and axum bring.
base64 = "0.22"

# Markdown Viewer's outline and syntax; parsing only, so its default features are off.
pulldown-cmark = { version = "0.13", default-features = false }

# Markdown Viewer's project search: the crate nsh's editor finds with, so both count the same.
regex = "1.12"

# Markdown Viewer's rendered page: GitHub's Markdown as HTML, each block with its source lines.
# Its library only: the default features are its command line's.
comrak = { version = "1.1", default-features = false }
# What comrak's README points to for the raw HTML a file holds: only harmless tags and attributes.
ammonia = "4.2"
# The page's formulas: TeX as MathML, which the web view draws itself.
pulldown-latex = "0.8"
# The page's code blocks: the syntaxes nsh's editor and `TextView` highlight with, at nsh-base 0.6.1's versions and
# with its pure-Rust regular expressions, so the app builds them once.
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }

# Tests only: a temporary folder for each test.
tempfile = "3"

# PNG snapshots and thumbnails; JPEG is read only, for a camera's event pictures.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# A drive's free space; only its space query, so the default `sync` feature is off.
fs4 = { version = "1.1", default-features = false }

dp-store = { path = "crates/dp/store" }
ipcamera-core = { path = "crates/ipcamera/core" }
ipcamera-dpapi = { path = "crates/ipcamera/dpapi" }
ipcamera-media = { path = "crates/ipcamera/media" }
ipcamera-storage = { path = "crates/ipcamera/storage" }
