# Decoding falls behind a 1080p camera unoptimized, even in a debug build.
# Here, not in a Cargo.toml: nsh builds through a workspace of its own, which reads only this.
[profile.dev.package.rust_h264]
opt-level = 3
[profile.dev.package.rust_h265]
opt-level = 3
[profile.dev.package.g2g-plugins]
opt-level = 3

# Full debug info only for the suite's own crates: everyone's made each PDB pass a gigabyte.
# Named one by one, since nsh's workspace takes the app in as a dependency, which `"*"` would catch.
[profile.dev.package."*"]
debug = "line-tables-only"
[profile.dev.package.nsh-app-ipcamera]
debug = true
[profile.dev.package.nsh-app-mdviewer]
debug = true
[profile.dev.package.dp-ui]
debug = true
[profile.dev.package.dp-store]
debug = true
[profile.dev.package.ipcamera-core]
debug = true
[profile.dev.package.ipcamera-dpapi]
debug = true
[profile.dev.package.ipcamera-media]
debug = true
[profile.dev.package.ipcamera-storage]
debug = true
[profile.dev.package.ipcamera-server]
debug = true
[profile.dev.package.mdviewer-core]
debug = true

# rust-lld links the app's debug build far faster than MSVC's `link.exe`.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

# Run these at the repository's root: an alias names a package of the workspace it runs in.
# `cargo package` is cargo's own, which an alias can't replace.
[alias]
ipcamera = "run -p xtask -- ipcamera"
ipcamera-web = "run -p xtask -- ipcamera-web"
package-ipcamera = "run -p xtask -- package-ipcamera"
package-ipcamera-web = "run -p xtask -- package-ipcamera-web"
mdviewer = "run -p xtask -- mdviewer"
package-mdviewer = "run -p xtask -- package-mdviewer"
screenshots = "run -p xtask -- screenshots"
